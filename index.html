<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedflip.Bloxy</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#050505;
      color:white;
      overflow-x:hidden;
    }

    header{
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      background:linear-gradient(to bottom,#000,#001a33);
    }

    h1{
      font-size:4rem;
      color:#00aaff;
      text-shadow:0 0 20px #00aaff;
    }

    p{
      margin-top:20px;
      font-size:1.2rem;
      color:#ccc;
      max-width:600px;
    }

    .discord-btn{
      margin-top:40px;
      padding:15px 35px;
      background:#0077ff;
      color:white;
      text-decoration:none;
      border-radius:12px;
      font-size:1.2rem;
      transition:0.3s;
      box-shadow:0 0 20px #0077ff;
    }

    .discord-btn:hover{
      transform:scale(1.05);
      background:#0099ff;
    }

    section{
      padding:80px 20px;
      text-align:center;
    }

    .card{
      background:#0d1117;
      border:1px solid #003366;
      border-radius:15px;
      padding:30px;
      max-width:700px;
      margin:auto;
      box-shadow:0 0 20px rgba(0,170,255,0.2);
    }

    footer{
      padding:30px;
      text-align:center;
      background:#020202;
      color:#777;
    }
  </style>
</head>
<body>

<header>
  <h1>Speedflip.Bloxy</h1>

  <p>
    Willkommen auf der offiziellen Community Website.
    Tritt unserem Discord bei und werde Teil der Community.
  </p>

  <a class="discord-btn" href="https://discord.gg/RxMVzxkU" target="_blank">
    Discord Beitreten
  </a>
</header>

<section>
  <div class="card">
    <h2 style="color:#00aaff;">Über Uns</h2>

    <p style="margin-top:20px;">
      Speedflip.Bloxy ist eine moderne Gaming & Community Plattform
      mit Fokus auf Community, Spaß und Events.
    </p>
  </div>
</section>

<footer>
  © 2026 Speedflip.Bloxy
</footer>

</body>
</html>
